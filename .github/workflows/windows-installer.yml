# Builds the Windows installer from the Windows zip of an existing GitHub
# release, so the installer holds exactly the files of that zip, checks it on
# a clean Windows (tools/windows/check-installer.ps1) and attaches it to the
# release. Windows release build runs it after attaching the zip; run it by
# hand (Actions > Windows installer > Run workflow) for a release that
# already has its zip.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose Windows zip to package (e.g. v0.1.3)"
        required: true
      attach:
        description: "Attach the installer to the release (otherwise keep it as a workflow artifact for 7 days)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      attach:
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The installer script and the checks come from this workflow's commit,
      # not from the tag, so a release made before the installer existed can
      # get one too. The test host only needs the VST3 SDK headers in JUCE.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout JUCE
        run: git submodule update --init --depth 1 third_party/JUCE

      - name: Download the release zip and the Visual C++ Redistributable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v')
          $name = "Kinu-Tune-$version-Windows-x64"
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "$name.zip"
          Expand-Archive "$name.zip" -DestinationPath stage
          if (-not (Test-Path "stage/$name/Kinu Tune.vst3")) { throw "the zip does not hold $name/Kinu Tune.vst3" }
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
          # Bundle it only if Microsoft signed it.
          $sig = Get-AuthenticodeSignature vc_redist.x64.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "vc_redist.x64.exe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Write-Host "vc_redist.x64.exe $((Get-Item vc_redist.x64.exe).VersionInfo.FileVersion), signed by $($sig.SignerCertificate.Subject)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STAGE_DIR=$PWD\stage\$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress | Out-Host
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DStageDir=$env:STAGE_DIR" "/DRedist=$PWD\vc_redist.x64.exe" "/O$PWD\Output" packaging\windows\KinuTune.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP_NAME=Kinu-Tune-$env:VERSION-Windows-x64-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Nothing is attached unless the installer works on a clean Windows.
      - name: Check the installer on a clean Windows
        shell: pwsh
        run: ./tools/windows/check-installer.ps1 -Setup "Output/$env:SETUP_NAME"

      - name: Attach to the release
        if: ${{ inputs.attach }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "Output/$env:SETUP_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Keep the installer as a workflow artifact
        if: ${{ !inputs.attach }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SETUP_NAME }}
          path: Output/${{ env.SETUP_NAME }}
          retention-days: 7
