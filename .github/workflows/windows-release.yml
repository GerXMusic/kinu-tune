# Builds the Windows (x64, CPU) VST3 for an existing GitHub release and
# attaches the zip to it, then the installer made from that zip (see
# windows-installer.yml). Run it by hand (Actions > Windows release build >
# Run workflow) after the release exists. fcpe.onnx, cent_table.bin,
# mel_filterbank.bin and pc_nsf_hifigan.onnx are in the repository; CMake
# downloads the GAME models from the OpenVPI release during configure.
name: Windows release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.1.0)"
        required: true
      ref:
        description: "Test build: build this branch or commit instead of the tag and keep the zip as a workflow artifact (the release is not changed)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive
          persist-credentials: false

      # Use the runner's default Visual Studio generator (as upstream PitchNet
      # does) and the CPU build of ONNX Runtime; DirectML is the Windows
      # default in CMakeLists.txt, so turn it off explicitly.
      - name: Configure
        run: cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_DEV_BUILD=OFF -DPITCHNET_ARA_DIAGNOSTICS=OFF -DPITCHNET_BUILD_TESTS=OFF

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel

      # Nothing is attached if the plug-in cannot be created like a host does
      # it, including under an older Visual C++ runtime. See the script.
      - name: Check the VST3 like a host does
        shell: pwsh
        run: ./tools/windows/check-vst3.ps1 -Vst3 "build/PitchNetPlugin_artefacts/Release/VST3/Kinu Tune.vst3"

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v')
          $name = "Kinu-Tune-$version-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$name/models", "$name/licenses" | Out-Null
          Copy-Item -Recurse "build/PitchNetPlugin_artefacts/Release/VST3/Kinu Tune.vst3" "$name/"
          foreach ($f in "fcpe.onnx", "cent_table.bin", "mel_filterbank.bin", "pc_nsf_hifigan.onnx") {
            Copy-Item "Resources/models/$f" "$name/models/"
          }
          Copy-Item -Recurse "Resources/models/GAME" "$name/models/"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, MODIFICATIONS.md "$name/"
          Copy-Item licenses/* "$name/licenses/"
          Copy-Item packaging/INSTALL-Windows.txt "$name/INSTALL.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach to the release
        if: ${{ inputs.ref == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ZIP_NAME.zip" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Keep the test build as a workflow artifact
        if: ${{ inputs.ref != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}-test
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 7

  installer:
    needs: windows-x64
    if: ${{ inputs.ref == '' }}
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ inputs.tag }}
      attach: true
