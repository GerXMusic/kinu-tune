# Tests de macOS en su propio workflow (D-284, 2026-11-23).
#
# Por que no esta en ci.yml: con 5 jobs en el mismo run, el de macOS se quedaba sin
# runner y moria "cancelled" a los 15 min con 0 pasos ejecutados. La sonda demostró
# que macos-15 se asigna bien cuando es el unico job macOS en vuelo (y que un segundo
# job macOS del mismo run se cancela sin arrancar). Aqui es el unico.
name: macOS tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  # Solo un PR cancela el run anterior: en main no, para no matar un job en cola.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      # The Core ML vocoder is not in the repository and the tests load no
      # model, so the model check only warns here.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPITCHNET_BUILD_TESTS=ON
          -DPITCHNET_REQUIRE_MODELS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # The hosted macOS runner has 3 CPUs and 7 GB of memory; an unbounded
      # parallel build starts dozens of compilers at once.
      - name: Build
        run: cmake --build build --config Release --parallel 3

      # Los ejecutables de test cargan ONNX Runtime en tiempo de ejecucion desde
      # build/Frameworks (es el cargador del plugin). Se deja ahi el dylib, con los
      # dos nombres, igual que en los bundles.
      - name: Stage ONNX Runtime for the tests
        run: |
          set -euo pipefail
          ort=$(ls -d build/_deps/onnxruntime-*-nuget-src/runtimes/osx-arm64/native 2>/dev/null | head -n1)
          if [ -z "$ort" ]; then echo "no encontre la carpeta nativa de ONNX Runtime" >&2; exit 1; fi
          mkdir -p build/Frameworks
          cp "$ort"/libonnxruntime*.dylib build/Frameworks/ || true
          cp "$ort/libonnxruntime.dylib" "build/Frameworks/libonnxruntime.$(sed -n 's/^set(ONNXRUNTIME_VERSION "\([0-9.]*\)".*/\1/p' CMakeLists.txt).dylib" 2>/dev/null || true
          ls -l build/Frameworks

      - name: Run the unit tests
        run: ctest --test-dir build --output-on-failure
