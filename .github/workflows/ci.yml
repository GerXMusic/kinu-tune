# Checks every push and pull request: builds TuneX with the unit tests on
# macOS (Apple silicon) and on Windows and runs them all, including the one
# test that loads the models (ModelInferenceTests), so analysis and synthesis
# are known to work on both. The Windows job also builds the VST3 and loads it
# in a minimal host, so code that only one compiler accepts is caught before a
# release. The suite is complete on both, so a developer does not need to build
# it locally to know whether a change is good.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The Core ML vocoder is not in the repository and the tests load no
      # model, so the model check only warns here.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPITCHNET_BUILD_TESTS=ON
          -DPITCHNET_REQUIRE_MODELS=OFF

      # The hosted macOS runner has 3 CPUs and 7 GB of memory; an unbounded
      # parallel build starts dozens of compilers at once.
      - name: Build
        run: cmake --build build --config Release --parallel 3

      # Los ejecutables de test cargan ONNX Runtime en tiempo de ejecucion desde
      # build/Frameworks (es el cargador del plugin). Se deja ahi el dylib, con los
      # dos nombres, igual que en los bundles.
      - name: Stage ONNX Runtime for the tests
        run: |
          set -euo pipefail
          ort=$(ls -d build/_deps/onnxruntime-*-nuget-src/runtimes/osx-arm64/native 2>/dev/null | head -n1)
          if [ -z "$ort" ]; then echo "no encontre la carpeta nativa de ONNX Runtime" >&2; exit 1; fi
          mkdir -p build/Frameworks
          cp "$ort"/libonnxruntime*.dylib build/Frameworks/ || true
          cp "$ort/libonnxruntime.dylib" "build/Frameworks/libonnxruntime.$(sed -n 's/^set(ONNXRUNTIME_VERSION "\([0-9.]*\)".*/\1/p' CMakeLists.txt).dylib" 2>/dev/null || true
          ls -l build/Frameworks

      - name: Run the unit tests
        run: ctest --test-dir build --output-on-failure

  windows-build:
    runs-on: windows-latest
    # The whole suite is built here now, and every test is its own executable,
    # so the budget is larger than when only the VST3 was built.
    timeout-minutes: 240
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # PITCHNET_BUILD_TESTS builds and registers the whole suite; the VST3 is
      # built by default, so one configure serves both.
      - name: Configure
        run: cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_BUILD_TESTS=ON

      # The hosted Windows runner has 4 CPUs and 16 GB of memory; every test is
      # its own executable, so an unbounded build starts dozens of links at once.
      - name: Build the VST3 and the unit tests
        run: cmake --build build --config Release --parallel 4

      # Runs every registered test. ModelInferenceTests loads fcpe.onnx, the
      # GAME models and pc_nsf_hifigan.onnx with the Windows ONNX Runtime and
      # checks the numbers: FCPE reports the tone's pitch, GAME finds the note,
      # the vocoder and PSOLA shift it by a minor third. See
      # tests/ModelInferenceTests.cpp.
      - name: Run the unit tests
        run: ctest --test-dir build -C Release --parallel 2 --output-on-failure

      # Creates the plug-in in a minimal host on the runner's runtime and on an
      # older Visual C++ runtime, then runs pluginval. See the script.
      - name: Check the VST3 like a host does
        shell: pwsh
        run: ./tools/windows/check-vst3.ps1 -Vst3 "build/PitchNetPlugin_artefacts/Release/VST3/TuneX.vst3"
