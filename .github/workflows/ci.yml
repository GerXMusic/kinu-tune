# Checks every push and pull request: builds TuneX and runs every unit test on
# Windows and on macOS, and loads the VST3 in a minimal host so code that only
# one compiler accepts is caught before a release.
#
# Why it stopped being one big Windows job (D-282, 2026-11-23): each test is its
# own executable with JUCE linked inside (~6.9 MB each), so one job linked 71 of
# them on a 4-vCPU runner and took 1 h 45. Now the tests are split into three
# shards that build and run their own ~21 targets in parallel, the VST3 check has
# its own job, and sccache reuses objects between runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo un PR cancela el run anterior. En main no: un push nuevo cancelaba el run
  # anterior mientras el job de macOS seguia EN COLA (0 pasos, cancelado a los
  # 15 min), aunque los shards de Windows ya estuvieran corriendo y acabaran bien
  # (D-284, 2026-11-23).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- Windows ---
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # D-379: the editor must not regain a network path (the PitchNet update
      # check was removed); tools/check-no-network.py guards Source.
      - name: Check that Source has no network code
        run: python tools/check-no-network.py

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      # PITCHNET_BUILD_TESTS builds and registers the whole suite; the VST3 is
      # built by its own job. The shard only builds its own targets.
      - name: Configure
        run: >
          cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build and run this shard's tests
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Los targets SON los .cpp de tests/ (tests/CMakeLists.txt usa NAME_WE), pero
          # no todos los .cpp son ejecutable: se confirma contra el proyecto generado
          # (build/tests/<nombre>.vcxproj). Asi no se pide construir un target que no
          # existe (MSB1009, 2026-11-23) y un test nuevo entra solo.
          $targets = Get-ChildItem tests -Filter *.cpp |
            ForEach-Object { $_.BaseName } |
            Where-Object { Test-Path (Join-Path 'build/tests' "$_.vcxproj") } |
            Sort-Object
          Write-Host "targets reales: $($targets.Count)"
          $n = [int]$env:SHARDS; $mine = @()
          for ($i = 0; $i -lt $targets.Count; $i++) {
            if ($i % $n -eq [int]$env:SHARD) { $mine += $targets[$i] }
          }
          Write-Host "shard $($env:SHARD)/$n : $($mine.Count) de $($targets.Count) targets"
          if ($mine.Count -eq 0) { throw "este shard no tiene targets" }

          cmake --build build --config Release --parallel 4 --target $mine
          if ($LASTEXITCODE -ne 0) { throw "build del shard fallo con $LASTEXITCODE" }

          # onnxruntime.dll solo la copian los targets del plugin y TimingAudioTests; un
          # shard que no los construye se queda sin DLL y AuditionHandoffTests falla
          # (OnnxRuntime::useLinkedRuntimeForTesting, 2026-11-23).
          # OJO: el paquete NuGet trae win-x64, win-x86 y win-arm64. Se elige por ruta:
          # ordenar por tamano eligio la arm64 (14,1 MB > 13,7 MB) y rompio ORT.
          $todas = Get-ChildItem build -Recurse -Filter 'onnxruntime.dll' -File -ErrorAction SilentlyContinue
          $ortDll = $todas | Where-Object { $_.FullName -like '*win-x64*' } | Select-Object -First 1
          if (-not $ortDll) { $ortDll = $todas | Where-Object { $_.FullName -notlike '*arm64*' -and $_.FullName -notlike '*x86*' } | Select-Object -First 1 }
          if ($ortDll) {
            $dst = Join-Path $PWD 'build/tests/Release'
            New-Item -ItemType Directory -Path $dst -Force | Out-Null
            Copy-Item $ortDll.FullName (Join-Path $dst $ortDll.Name) -Force
            Write-Host "onnxruntime.dll desde $($ortDll.FullName)"
            if ($ortDll.FullName -notlike '*win-x64*') { Write-Host "AVISO: no es la win-x64" }
          } else {
            Write-Host "aviso: no encontre onnxruntime.dll (win-x64) dentro de build/"
          }

          # Nombres de test de este shard. Casi todos coinciden con el ejecutable;
          # estas son las excepciones reales (medidas con ctest --show-only en local).
          $extra = @{
            'P1bHostPlayTests'      = @('P1b_hostplay')
            'P1bSaveTests'          = @('P1b_save')
            'P1bOpenTests'          = @('P1b_open')
            'P1bSweepTests'         = @('P1b_sweep')
            'P1bRenderAtPlayTests'  = @('P1b_deferred', 'P1b_wiring')
            'EditSymptomAudioTests' = @('EditSymptom_sbedge')
          }
          $names = @()
          foreach ($t in $mine) {
            $names += [regex]::Escape($t)
            if ($extra.ContainsKey($t)) { foreach ($e in $extra[$t]) { $names += [regex]::Escape($e) } }
          }
          # Los SourceGuard_* no tienen ejecutable: lanzan cmake con un script.
          if ([int]$env:SHARD -eq 0) {
            foreach ($g in 'SourceGuard_pitch-writes', 'SourceGuard_audition-output', 'SourceGuard_render-controllers') {
              $names += [regex]::Escape($g)
            }
          }
          Write-Host "tests: $($names.Count)"
          ctest --test-dir build -C Release -R "^($($names -join '|'))$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ctest del shard fallo con $LASTEXITCODE" }

  # The plug-in itself, once: built and loaded like a host does it. Kept apart so
  # one VST3 link is not paid by every test shard.
  windows-vst3-check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Configure
        run: >
          cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_BUILD_TESTS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel 4

      # Creates the plug-in in a minimal host on the runner's runtime and on an
      # older Visual C++ runtime, with System32's onnxruntime.dll shadowing the
      # bundled one, then runs pluginval. See the script.
      #
      # D-283: blocking again. The premise is no longer "a clean machine has no
      # ONNX Runtime" (newer Windows ships one in System32); what must hold is
      # that the plug-in uses ITS OWN bundled runtime, checked on the loaded
      # module, and that it never falls back to a foreign one.
      - name: Check the VST3 like a host does
        shell: pwsh
        run: ./tools/windows/check-vst3.ps1 -Vst3 "build/PitchNetPlugin_artefacts/Release/VST3/TuneX.vst3"

