# Checks every push and pull request: builds Kinu Tune with the unit tests on
# macOS (Apple silicon) and runs them, and builds the Windows VST3 so code that
# only one compiler accepts is caught before a release. On Windows it also runs
# the one test that loads the models (ModelInferenceTests), so analysis and
# synthesis are known to work there and not only on macOS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The Core ML vocoder is not in the repository and the tests load no
      # model, so the model check only warns here.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPITCHNET_BUILD_TESTS=ON
          -DPITCHNET_REQUIRE_MODELS=OFF

      # The hosted macOS runner has 3 CPUs and 7 GB of memory; an unbounded
      # parallel build starts dozens of compilers at once.
      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run the unit tests
        run: ctest --test-dir build --output-on-failure

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # PITCHNET_BUILD_TESTS registers the tests; only ModelInferenceTests is
      # built and run here (the rest run on macOS).
      - name: Configure
        run: cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_BUILD_TESTS=ON

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel

      # Loads fcpe.onnx, the GAME models and pc_nsf_hifigan.onnx with the
      # Windows ONNX Runtime and checks the numbers: FCPE reports the tone's
      # pitch, GAME finds the note, the vocoder and PSOLA shift it by a minor
      # third. See tests/ModelInferenceTests.cpp.
      - name: Build the model inference test
        run: cmake --build build --config Release --target ModelInferenceTests --parallel

      - name: Run the model inference test
        run: ctest --test-dir build -C Release -R ModelInferenceTests --output-on-failure

      # Creates the plug-in in a minimal host on the runner's runtime and on an
      # older Visual C++ runtime, then runs pluginval. See the script.
      - name: Check the VST3 like a host does
        shell: pwsh
        run: ./tools/windows/check-vst3.ps1 -Vst3 "build/PitchNetPlugin_artefacts/Release/VST3/Kinu Tune.vst3"
